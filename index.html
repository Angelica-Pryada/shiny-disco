<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Свадьба 15.05.2027</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&family=Prata&display=swap">
<style>
  :root {
    --cream:      #FFFBF4;
    --surface:    #FFFFFF;
    --surface-2:  #FFF3E8;
    --ink:        #3B3327;
    --ink-soft:   #7C7160;
    --ink-faint:  #ADA292;
    --line:       #F0E2D2;
    --line-2:     #F7EDE2;

    --peach:      #FFC9A3;
    --peach-soft: #FFEDDF;
    --peach-deep: #E8804A;
    --lime:       #B9DC79;
    --lime-soft:  #EDF6DC;
    --lime-deep:  #5E8C24;
    --yellow:     #FFD84A;
    --yellow-soft:#FFF3CB;
    --yellow-deep:#A6810E;

    --shadow-sm:  0 2px 6px rgba(94, 66, 41, .06);
    --shadow-md:  0 10px 28px -18px rgba(94, 66, 41, .45);

    --display: "Prata", Georgia, serif;
    --body: "Manrope", "Segoe UI", system-ui, sans-serif;

    --r-lg: 22px;
    --r-md: 14px;
    --r-sm: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --cream:      #211C16;
      --surface:    #2A231C;
      --surface-2:  #332A21;
      --ink:        #FAF2E7;
      --ink-soft:   #BCAE9B;
      --ink-faint:  #8B7F6E;
      --line:       #3E3428;
      --line-2:     #352C22;

      --peach:      #E8A277;
      --peach-soft: #3A2B20;
      --peach-deep: #F0A173;
      --lime:       #A8CC6A;
      --lime-soft:  #2B3320;
      --lime-deep:  #B6D97C;
      --yellow:     #EFC749;
      --yellow-soft:#38301B;
      --yellow-deep:#F0CE6A;

      --shadow-sm:  0 2px 6px rgba(0, 0, 0, .35);
      --shadow-md:  0 10px 28px -18px rgba(0, 0, 0, .9);
    }
  }
  :root[data-theme="dark"] {
    --cream:      #211C16;
    --surface:    #2A231C;
    --surface-2:  #332A21;
    --ink:        #FAF2E7;
    --ink-soft:   #BCAE9B;
    --ink-faint:  #8B7F6E;
    --line:       #3E3428;
    --line-2:     #352C22;

    --peach:      #E8A277;
    --peach-soft: #3A2B20;
    --peach-deep: #F0A173;
    --lime:       #A8CC6A;
    --lime-soft:  #2B3320;
    --lime-deep:  #B6D97C;
    --yellow:     #EFC749;
    --yellow-soft:#38301B;
    --yellow-deep:#F0CE6A;

    --shadow-sm:  0 2px 6px rgba(0, 0, 0, .35);
    --shadow-md:  0 10px 28px -18px rgba(0, 0, 0, .9);
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    position: relative;
    overflow-x: clip;
    background: var(--cream);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 800px;
    margin: 0 auto;
    padding-inline: 20px;
    padding-block: 0 84px;
    display: flex;
    flex-direction: column;
    gap: 36px;
  }
  .eyebrow {
    margin: 0;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .24em;
    text-transform: uppercase;
    text-indent: .24em;
    color: var(--peach-deep);
  }

  /* ——— цветы одной линией, рассыпанные по фону ——— */
  .flora-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
  .garden {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .garden svg {
    position: absolute;
    height: auto;
    color: var(--peach-deep);
    opacity: .42;
  }
  .garden .lime { color: var(--lime-deep); }
  .garden .gold { color: var(--yellow-deep); }
  @media (max-width: 900px) { .garden svg { opacity: .3; } }

  /* ——— вход по кодовому слову ——— */
  .gate {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .gate-card {
    width: min(380px, 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    text-align: center;
  }
  .gate-card svg { width: 96px; height: auto; color: var(--peach-deep); opacity: .55; }
  .gate-card h1 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; }
  .gate-card p { margin: 0; font-size: 14px; color: var(--ink-soft); }
  .gate-form { display: flex; gap: 8px; width: 100%; margin-top: 4px; }
  .gate-error { font-size: 13px; color: var(--peach-deep); min-height: 20px; }

  /* ——— шапка ——— */
  .hero {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
    padding-block: 46px 40px;
    padding-inline: 20px;
    margin-inline: -20px;
    border-radius: 0 0 var(--r-lg) var(--r-lg);
    background:
      radial-gradient(70% 58% at 12% 6%, var(--peach-soft), transparent 70%),
      radial-gradient(62% 55% at 92% 16%, var(--yellow-soft), transparent 72%),
      radial-gradient(72% 60% at 50% 108%, var(--lime-soft), transparent 74%),
      var(--surface);
    overflow: hidden;
  }
  .hero > * { position: relative; z-index: 1; }
  .hero-title {
    font-family: var(--display);
    font-size: clamp(24px, 5.4vw, 34px);
    line-height: 1.2;
    letter-spacing: .01em;
    color: var(--ink);
    text-align: center;
    background: transparent;
    border: 0;
    border-bottom: 1px dashed transparent;
    padding: 2px 6px;
    width: 100%;
    max-width: 18ch;
  }
  .hero-title:hover { border-bottom-color: var(--peach); }
  .hero-title:focus { outline: none; border-bottom-color: var(--peach-deep); }

  .date {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 99px;
    padding: 7px 18px;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: .1em;
    font-variant-numeric: tabular-nums;
    box-shadow: var(--shadow-sm);
  }
  .date::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 99px;
    background: var(--peach-deep);
    flex: none;
  }

  .sun {
    margin-top: 6px;
    width: clamp(190px, 52vw, 248px);
    aspect-ratio: 1;
    max-width: 100%;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 44%, var(--yellow-soft) 0%, var(--peach-soft) 58%, transparent 73%);
    position: relative;
  }
  .sun::before {
    content: "";
    position: absolute;
    inset: 8%;
    border-radius: 50%;
    border: 1px dashed var(--lime);
    opacity: .75;
  }
  .sun b {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(62px, 17vw, 100px);
    line-height: 1;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .count-word {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .22em;
    text-transform: uppercase;
    text-indent: .22em;
    color: var(--ink-soft);
    margin-top: -4px;
  }
  .date-edit { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  .linkish {
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    background: none;
    border: 0;
    padding: 2px 0;
    color: var(--ink-faint);
    border-bottom: 1.5px solid var(--line);
    cursor: pointer;
  }
  .linkish:hover { color: var(--peach-deep); border-bottom-color: var(--peach); }
  input[type="date"] {
    font: inherit;
    font-size: 13.5px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    padding: 6px 10px;
  }

  /* ——— потрачено ——— */
  .spend {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-md);
    padding: 24px 26px 22px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .spend-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
  .spend-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .2em;
    text-transform: uppercase;
    text-indent: .2em;
    color: var(--ink-soft);
  }
  .spend-value {
    font-family: var(--display);
    font-size: clamp(36px, 9vw, 52px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    width: 100%;
  }
  .track {
    height: 12px;
    border-radius: 99px;
    background: var(--peach-soft);
    overflow: hidden;
  }
  .track-fill {
    height: 100%;
    width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--lime), var(--yellow));
    transition: width .6s cubic-bezier(.2,.7,.3,1);
  }
  .track-note { font-size: 13.5px; color: var(--ink-soft); margin: 0; }
  .track-note b { color: var(--lime-deep); font-weight: 700; }

  /* ——— список ——— */
  .list-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 6px; }
  h2 {
    font-family: var(--display);
    font-weight: 400;
    font-size: 22px;
    margin: 0;
    color: var(--ink);
  }
  .items { display: flex; flex-direction: column; gap: 6px; }
  .item {
    background: var(--surface);
    border: 1px solid var(--line-2);
    border-radius: var(--r-md);
    overflow: hidden;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .item:hover { border-color: var(--peach); }
  .item.open { border-color: var(--peach); box-shadow: var(--shadow-sm); }
  .item.done { background: linear-gradient(90deg, var(--lime-soft), var(--surface) 42%); }
  .item-head {
    width: 100%;
    display: grid;
    grid-template-columns: 2rem minmax(0,1fr) auto auto;
    align-items: center;
    gap: 6px 14px;
    background: none;
    border: 0;
    font: inherit;
    color: inherit;
    text-align: left;
    padding: 15px 18px;
    cursor: pointer;
  }
  .item-head:focus-visible { outline: 2px solid var(--peach-deep); outline-offset: -2px; }
  .num {
    font-family: var(--display);
    font-size: 19px;
    color: var(--peach-deep);
    font-variant-numeric: tabular-nums;
  }
  .item-name { font-size: 16.5px; font-weight: 500; }
  .item-meta { display: flex; align-items: center; gap: 14px; }
  .chip {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 99px;
    white-space: nowrap;
    background: var(--yellow-soft);
    color: var(--yellow-deep);
  }
  .chip.paid { background: var(--lime-soft); color: var(--lime-deep); }
  .item-sum {
    font-family: var(--display);
    font-size: 21px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    text-align: right;
  }
  .item-sum.zero { font-family: var(--body); font-size: 13px; color: var(--ink-faint); }
  @media (max-width: 560px) {
    .item-head { grid-template-columns: 1.6rem minmax(0,1fr) auto; padding: 14px; }
    .item-meta { grid-column: 2 / -1; justify-content: space-between; }
  }

  .panel { padding: 4px 18px 22px 18px; display: flex; flex-direction: column; gap: 18px; }
  @media (max-width: 560px) { .panel { padding-inline: 14px; } }

  .subs { display: flex; flex-direction: column; gap: 6px; }
  .subs-label {
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .item.sub { background: var(--surface-2); border-color: transparent; }
  .item.sub.done { background: var(--lime-soft); }
  .item.sub .item-head { padding: 11px 14px; grid-template-columns: 1.2rem minmax(0,1fr) auto auto; }
  .item.sub .num { font-size: 15px; color: var(--ink-faint); }
  .item.sub .item-name { font-size: 15px; font-weight: 500; }
  .item.sub .item-sum { font-size: 18px; }
  .item.sub .panel { padding: 0 14px 16px; gap: 14px; }
  @media (max-width: 560px) { .item.sub .item-head { grid-template-columns: 1rem minmax(0,1fr) auto; } }

  /* ——— варианты ——— */
  .options { display: grid; grid-template-columns: repeat(auto-fill, minmax(172px, 1fr)); gap: 14px; }
  .option {
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--r-md);
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .option.bought { border-color: var(--lime); background: linear-gradient(180deg, var(--lime-soft), var(--surface) 55%); }
  .shot {
    position: relative;
    aspect-ratio: 3 / 4;
    max-width: 100%;
    background: var(--peach-soft);
    border-radius: var(--r-sm);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot .no-photo {
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--peach-deep);
    opacity: .75;
  }
  .badge {
    position: absolute;
    left: 8px;
    bottom: 8px;
    background: var(--lime-deep);
    color: var(--cream);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 99px;
  }
  .option .name { font-size: 14px; line-height: 1.4; padding-inline: 4px; }
  .option .price {
    font-family: var(--display);
    font-size: 22px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    padding-inline: 4px;
  }
  .option .price.none { font-family: var(--body); font-size: 12.5px; color: var(--ink-faint); }
  .option a.shop {
    font-size: 12px;
    font-weight: 600;
    color: var(--peach-deep);
    text-decoration: none;
    border-bottom: 1.5px solid var(--peach);
    align-self: flex-start;
    margin-inline: 4px;
    word-break: break-all;
  }
  .option a.shop:hover { border-bottom-color: var(--peach-deep); }
  .option .acts { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: auto; padding: 2px 4px 0; }
  .mark {
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: none;
    border: 0;
    padding: 3px 0;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .mark:hover { color: var(--lime-deep); }
  .mark .tick {
    width: 18px; height: 18px;
    border: 1.5px solid var(--line);
    border-radius: 99px;
    display: grid;
    place-items: center;
    font-size: 10px;
    color: transparent;
    flex: none;
  }
  .option.bought .mark { color: var(--lime-deep); }
  .option.bought .mark .tick { border-color: var(--lime-deep); background: var(--lime-deep); color: var(--surface); }
  .kill {
    font: inherit;
    font-size: 12px;
    background: none;
    border: 1.5px solid transparent;
    border-radius: 99px;
    color: var(--ink-faint);
    padding: 3px 9px;
    cursor: pointer;
  }
  .kill:hover, .kill:focus-visible { border-color: var(--line); color: var(--ink-soft); }
  .kill.armed { color: var(--peach-deep); border-color: var(--peach); }
  .card-tools { display: flex; align-items: center; gap: 4px; }

  .option.editing { border-color: var(--peach-deep); }
  .edit-fields { display: grid; gap: 8px; padding-inline: 4px; }
  .edit-fields input.box { font-size: 13.5px; padding: 7px 9px; }
  .edit-acts { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 4px 0; }
  button.mini {
    font: inherit;
    font-size: 12.5px;
    font-weight: 700;
    border-radius: 99px;
    padding: 6px 15px;
    cursor: pointer;
    border: 1.5px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
  }
  button.mini:hover { border-color: var(--peach-deep); color: var(--peach-deep); }
  button.mini.save { background: var(--lime-deep); border-color: var(--lime-deep); color: var(--cream); }
  button.mini.save:hover { filter: brightness(1.06); color: var(--cream); }
  button.mini:disabled { opacity: .5; cursor: default; }

  .rename-row { display: flex; flex-direction: column; gap: 4px; max-width: 420px; }
  .rename-row > span {
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  /* ——— формы ——— */
  .add-option {
    background: var(--surface-2);
    border-radius: var(--r-md);
    padding: 16px;
    display: grid;
    gap: 12px;
  }
  .add-grid { display: grid; grid-template-columns: 1fr 1fr 8rem; gap: 10px; }
  @media (max-width: 620px) { .add-grid { grid-template-columns: 1fr; } }
  label.field { display: flex; flex-direction: column; gap: 5px; }
  label.field > span {
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  input.box {
    font: inherit;
    font-size: 14.5px;
    color: var(--ink);
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--r-sm);
    padding: 9px 12px;
    width: 100%;
    min-width: 0;
  }
  input.box::placeholder { color: var(--ink-faint); }
  input.box:focus { outline: none; border-color: var(--peach-deep); box-shadow: 0 0 0 3px var(--peach-soft); }
  .add-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between; }
  .photo-pick { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-soft); min-width: 0; }
  .photo-pick label {
    font-size: 12.5px;
    font-weight: 700;
    border: 1.5px solid var(--line);
    border-radius: 99px;
    padding: 7px 16px;
    cursor: pointer;
    background: var(--surface);
    white-space: nowrap;
  }
  .photo-pick label:hover { border-color: var(--peach-deep); color: var(--peach-deep); }
  .photo-pick input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .photo-pick .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button.primary {
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    padding: 10px 22px;
    border: 0;
    border-radius: 99px;
    background: var(--peach-deep);
    color: #FFFFFF;
    cursor: pointer;
  }
  button.primary:hover { filter: brightness(1.05); }
  button.primary:disabled { opacity: .5; cursor: default; }
  button.primary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button.ghost {
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 99px;
    color: var(--ink-soft);
    padding: 9px 18px;
    cursor: pointer;
    white-space: nowrap;
  }
  button.ghost:hover { border-color: var(--lime); color: var(--lime-deep); }

  .new-item { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .new-item input.box { flex: 1 1 220px; }
  .hint { font-size: 13px; color: var(--ink-faint); margin: 0; }

  footer.status-bar {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 12.5px;
    color: var(--ink-faint);
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }
  .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--ink-faint); flex: none; }
  .dot.live { background: var(--lime); }
  .dot.off { background: var(--peach-deep); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<svg class="flora-defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- пион: пять лепестков одной непрерывной линией -->
    <path id="fl-a" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"
          d="M92 298 C 88 266 96 244 110 226 C 118 214 116 208 110 205
             C 126 194 152 184 172 188 C 182 190 174 200 158 204
             C 142 208 118 210 110 205 C 103 200 100 190 100 178
             C 88 142 74 137 44 158 C 54 193 68 198 100 178

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ============================================================
   НАСТРОЙКИ — здесь три строки, которые нужно заполнить.
   Supabase → Settings → API:
     Project URL      → SUPABASE_URL
     anon public key  → SUPABASE_ANON_KEY
   CODE_WORD — кодовое слово для входа на страницу.
   Чтобы сменить его позже: откройте index.html на GitHub,
   нажмите карандаш, поправьте строку, Commit changes.
   ============================================================ */
var CONFIG = {
  SUPABASE_URL: "ВСТАВЬТЕ_PROJECT_URL",
  SUPABASE_ANON_KEY: "ВСТАВЬТЕ_ANON_PUBLIC_KEY",
  BUCKET: "wedding",
  CODE_WORD: "15052027"
};
</script>
<script>
(function () {
  "use strict";

  var nf = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 0 });
  var DEFAULT_DATE = "2027-05-15";

  var el = {
    gate: document.getElementById("gate"),
    gateForm: document.getElementById("gate-form"),
    gateInput: document.getElementById("gate-input"),
    gateError: document.getElementById("gate-error"),
    page: document.getElementById("page"),
    heroTitle: document.getElementById("hero-title"),
    dateText: document.getElementById("date-text"),
    dateToggle: document.getElementById("date-toggle"),
    dateInput: document.getElementById("date-input"),
    days: document.getElementById("days"),
    daysWord: document.getElementById("days-word"),
    spent: document.getElementById("spent"),
    bar: document.getElementById("bar"),
    progressNote: document.getElementById("progress-note"),
    items: document.getElementById("items"),
    listHint: document.getElementById("list-hint"),
    toggleAll: document.getElementById("toggle-all"),
    newItemForm: document.getElementById("new-item"),
    newItemTitle: document.getElementById("new-item-title"),
    dot: document.getElementById("dot"),
    status: document.getElementById("status")
  };

  var sb = null, ready = false, localMode = false;
  var state = {
    meta: { title: "Наша свадьба", date: DEFAULT_DATE },
    items: [],
    options: [],
    open: Object.create(null),
    drafts: Object.create(null),
    renames: Object.create(null),
    renameTimers: Object.create(null),
    editOpt: Object.create(null),
    optDrafts: Object.create(null)
  };

  /* ——— мелкие помощники ——— */

  function money(n) { return nf.format(Math.round(n)) + " ₽"; }

  function plural(n, one, few, many) {
    var a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return one;
    if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return few;
    return many;
  }

  function pad(n) { return n < 10 ? "0" + n : String(n); }

  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }

  function setStatus(text, kind) {
    el.status.textContent = text;
    el.dot.className = "dot" + (kind ? " " + kind : "");
  }

  function parseNum(raw) {
    var v = parseFloat(String(raw).replace(/[^\d.,-]/g, "").replace(/\s/g, "").replace(",", "."));
    return isFinite(v) ? Math.abs(v) : NaN;
  }

  function safeUrl(raw) {
    var s = String(raw || "").trim();
    if (!s) return "";
    if (!/^https?:\/\//i.test(s)) s = "https://" + s;
    try { var u = new URL(s); return (u.protocol === "http:" || u.protocol === "https:") ? u.href : ""; }
    catch (e) { return ""; }
  }

  function hostOf(href) {
    try { return new URL(href).hostname.replace(/^www\./, ""); } catch (e) { return "ссылка"; }
  }

  function photoUrl(path) {
    if (!path) return "";
    /* В локальном режиме фото лежит прямо в строке варианта. */
    if (path.indexOf("data:") === 0) return path;
    return CONFIG.SUPABASE_URL.replace(/\/+$/, "") +
           "/storage/v1/object/public/" + CONFIG.BUCKET + "/" + path;
  }

  function store(key, value) {
    try {
      if (value === undefined) return localStorage.getItem(key);
      localStorage.setItem(key, value);
    } catch (e) { /* приватное окно — просто работаем без памяти */ }
    return null;
  }

  function fail(err, what) {
    var msg = err && err.message ? err.message : String(err);
    setStatus(what + ": " + msg, "off");
  }

  /* ——— вход по кодовому слову ——— */

  function openPage() {
    el.gate.hidden = true;
    el.page.hidden = false;
    start();
  }

  function initGate() {
    var word = String(CONFIG.CODE_WORD || "").trim().toLowerCase();
    if (!word) { openPage(); return; }
    if (store("svadba:key") === word) { openPage(); return; }

    el.gate.hidden = false;
    el.gateInput.focus();
    el.gateForm.addEventListener("submit", function (ev) {
      ev.preventDefault();
      if (el.gateInput.value.trim().toLowerCase() === word) {
        store("svadba:key", word);
        openPage();
      } else {
        el.gateError.textContent = "Не то слово. Попробуйте ещё раз.";
        el.gateInput.select();
      }
    });
  }

  /* ——— дата и обратный отсчёт ——— */

  function renderDate() {
    var iso = state.meta.date || DEFAULT_DATE;
    var parts = iso.split("-");
    el.dateText.textContent = parts.length === 3 ? parts[2] + "." + parts[1] + "." + parts[0] : iso;
    if (document.activeElement !== el.dateInput) el.dateInput.value = iso;

    var target = new Date(parts[0], Number(parts[1]) - 1, parts[2]);
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var diff = Math.round((target - today) / 86400000);

    if (diff > 0) {
      el.days.textContent = nf.format(diff);
      el.daysWord.textContent = plural(diff, "день остался", "дня осталось", "дней осталось");
    } else if (diff === 0) {
      el.days.textContent = "🤍";
      el.daysWord.textContent = "сегодня свадьба";
    } else {
      el.days.textContent = nf.format(-diff);
      el.daysWord.textContent = plural(-diff, "день вместе", "дня вместе", "дней вместе");
    }
  }

  el.dateToggle.addEventListener("click", function () {
    el.dateInput.hidden = !el.dateInput.hidden;
    if (!el.dateInput.hidden) el.dateInput.focus();
  });
  el.dateInput.addEventListener("change", function () {
    if (!el.dateInput.value) return;
    state.meta.date = el.dateInput.value;
    renderDate();
    saveMeta();
  });

  var metaTimer = null;
  function saveMeta() {
    if (!ready) return;
    clearTimeout(metaTimer);
    metaTimer = setTimeout(function () {
      sb.from("wedding_meta").upsert({
        id: "wedding",
        title: el.heroTitle.value.trim() || "Наша свадьба",
        wedding_date: state.meta.date || DEFAULT_DATE
      }).then(function (res) { if (res.error) fail(res.error, "Не удалось сохранить"); });
    }, 500);
  }
  el.heroTitle.addEventListener("input", saveMeta);

  /* ——— подсчёты ——— */

  function optionsOf(itemId) {
    var out = [];
    for (var i = 0; i < state.options.length; i++) {
      if (state.options[i].itemId === itemId) out.push(state.options[i]);
    }
    return out;
  }

  function childrenOf(itemId) {
    var out = [];
    for (var i = 0; i < state.items.length; i++) {
      if (state.items[i].parentId === itemId) out.push(state.items[i]);
    }
    return out;
  }

  /* Пункт «оплачен», когда куплен хотя бы один его вариант
     и закрыты все его подпункты. */
  function isDone(item) {
    var opts = optionsOf(item.id);
    var kids = childrenOf(item.id);
    if (!opts.length && !kids.length) return false;
    if (opts.length) {
      var own = false;
      for (var i = 0; i < opts.length; i++) if (opts[i].paid) own = true;
      if (!own) return false;
    }
    for (var j = 0; j < kids.length; j++) if (!isDone(kids[j])) return false;
    return true;
  }

  /* Потрачено по пункту вместе с подпунктами. */
  function paidSumOf(item) {
    var opts = optionsOf(item.id), sum = 0;
    for (var i = 0; i < opts.length; i++) if (opts[i].paid) sum += opts[i].price || 0;
    var kids = childrenOf(item.id);
    for (var j = 0; j < kids.length; j++) sum += paidSumOf(kids[j]);
    return sum;
  }

  function renderTotals() {
    var spent = 0, done = 0;
    for (var i = 0; i < state.options.length; i++) {
      if (state.options[i].paid) spent += state.options[i].price || 0;
    }
    for (var j = 0; j < state.items.length; j++) if (isDone(state.items[j])) done++;

    el.spent.textContent = money(spent);
    var share = state.items.length ? done / state.items.length : 0;
    el.bar.style.width = (share * 100).toFixed(1) + "%";

    el.progressNote.textContent = "";
    el.progressNote.appendChild(document.createTextNode("Закрыто "));
    var b = document.createElement("b");
    b.textContent = String(done);
    el.progressNote.appendChild(b);
    el.progressNote.appendChild(document.createTextNode(
      " из " + state.items.length + " " + plural(state.items.length, "пункта", "пунктов", "пунктов")));
  }

  /* ——— отрисовка списка ——— */

  function render() {
    var focusId = document.activeElement && document.activeElement.id;
    var caret = null;
    if (focusId && document.activeElement.selectionStart != null) caret = document.activeElement.selectionStart;

    el.items.textContent = "";
    var tops = [];
    for (var i = 0; i < state.items.length; i++) if (!state.items[i].parentId) tops.push(state.items[i]);
    for (var k = 0; k < tops.length; k++) el.items.appendChild(itemNode(tops[k], false, k + 1));
    el.listHint.hidden = state.items.length > 0;

    renderTotals();

    if (focusId) {
      var back = document.getElementById(focusId);
      if (back && back !== document.activeElement) {
        back.focus();
        if (caret != null && back.setSelectionRange) { try { back.setSelectionRange(caret, caret); } catch (e) {} }
      }
    }
  }

  function itemNode(item, isSub, index) {
    var opts = optionsOf(item.id);
    var kids = childrenOf(item.id);
    var paidSum = paidSumOf(item);
    var done = isDone(item);

    var wrap = document.createElement("div");
    wrap.className = "item" + (isSub ? " sub" : "") + (done ? " done" : "") + (state.open[item.id] ? " open" : "");

    var head = document.createElement("button");
    head.type = "button";
    head.className = "item-head";
    head.setAttribute("aria-expanded", state.open[item.id] ? "true" : "false");

    var num = document.createElement("span");
    num.className = "num";
    num.textContent = isSub ? "•" : pad(index);
    head.appendChild(num);

    var name = document.createElement("span");
    name.className = "item-name";
    name.textContent = item.title;
    head.appendChild(name);

    var meta = document.createElement("span");
    meta.className = "item-meta";

    var chip = document.createElement("span");
    chip.className = "chip" + (done ? " paid" : "");
    chip.textContent = done ? "оплачено" : "в планах";
    meta.appendChild(chip);

    var sum = document.createElement("span");
    sum.className = "item-sum" + (paidSum ? "" : " zero");
    sum.textContent = paidSum ? money(paidSum)
      : (opts.length ? opts.length + " " + plural(opts.length, "вариант", "варианта", "вариантов")
        : (kids.length ? kids.length + " " + plural(kids.length, "подпункт", "подпункта", "подпунктов") : "—"));
    meta.appendChild(sum);

    head.appendChild(meta);
    head.addEventListener("click", function () {
      state.open[item.id] = !state.open[item.id];
      render();
    });
    wrap.appendChild(head);

    if (state.open[item.id]) wrap.appendChild(panelNode(item, opts, kids, isSub));
    return wrap;
  }

  function panelNode(item, opts, kids, isSub) {
    var panel = document.createElement("div");
    panel.className = "panel";

    panel.appendChild(renameRow(item, isSub));

    if (opts.length) {
      var grid = document.createElement("div");
      grid.className = "options";
      for (var i = 0; i < opts.length; i++) grid.appendChild(optionNode(opts[i]));
      panel.appendChild(grid);
    } else {
      var hint = document.createElement("p");
      hint.className = "hint";
      hint.textContent = "Вариантов пока нет. Добавьте первый — фото, ссылку и цену.";
      panel.appendChild(hint);
    }

    panel.appendChild(addFormNode(item));

    if (kids.length) {
      var subs = document.createElement("div");
      subs.className = "subs";
      var label = document.createElement("div");
      label.className = "subs-label";
      label.textContent = "Подпункты";
      subs.appendChild(label);
      for (var k = 0; k < kids.length; k++) subs.appendChild(itemNode(kids[k], true, k + 1));
      panel.appendChild(subs);
    }

    var foot = document.createElement("div");
    foot.style.display = "flex";
    foot.style.flexWrap = "wrap";
    foot.style.gap = "10px";
    foot.style.alignItems = "center";
    foot.style.justifyContent = "space-between";
    if (!isSub) foot.appendChild(addSubFormNode(item));
    else foot.appendChild(document.createElement("span"));
    foot.appendChild(killButton(isSub ? "удалить подпункт" : "удалить пункт",
      "Удалить пункт со всеми вариантами", function () { return deleteItem(item); }));
    panel.appendChild(foot);

    return panel;
  }

  /* Название пункта правится прямо в раскрытом блоке. */
  function renameRow(item, isSub) {
    var row = document.createElement("label");
    row.className = "rename-row";
    row.setAttribute("for", "name-" + item.id);

    var span = document.createElement("span");
    span.textContent = isSub ? "Название подпункта" : "Название пункта";
    row.appendChild(span);

    var input = document.createElement("input");
    input.className = "box";
    input.id = "name-" + item.id;
    input.maxLength = 60;
    input.value = state.renames[item.id] != null ? state.renames[item.id] : item.title;
    input.addEventListener("input", function () {
      state.renames[item.id] = input.value;
      clearTimeout(state.renameTimers[item.id]);
      state.renameTimers[item.id] = setTimeout(function () {
        var title = input.value.trim();
        if (!title) return;
        sb.from("wedding_items").update({ title: title }).eq("id", item.id)
          .then(function (res) {
            if (res.error) fail(res.error, "Не удалось переименовать");
            else reload();
          });
      }, 600);
    });
    row.appendChild(input);
    return row;
  }

  function addSubFormNode(item) {
    var form = document.createElement("form");
    form.className = "new-item";
    form.style.margin = "0";
    form.autocomplete = "off";
    var input = document.createElement("input");
    input.className = "box";
    input.id = "sub-title-" + item.id;
    input.placeholder = "Подпункт, например: туфли";
    input.maxLength = 60;
    input.setAttribute("aria-label", "Название подпункта");
    input.style.flex = "1 1 180px";
    var draft = draftFor("sub:" + item.id);
    input.value = draft.title;
    input.addEventListener("input", function () { draft.title = input.value; });
    var btn = document.createElement("button");
    btn.type = "submit";
    btn.className = "ghost";
    btn.textContent = "+ подпункт";
    form.appendChild(input);
    form.appendChild(btn);
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var title = input.value.trim();
      if (!title) { input.focus(); return; }
      btn.disabled = true;
      addItem(title, item.id).then(function () {
        draft.title = "";
        input.value = "";
        state.open[item.id] = true;
      }).catch(function (err) {
        fail(err, "Не удалось добавить подпункт");
      }).then(function () { btn.disabled = false; });
    });
    return form;
  }

  /* ——— запись в базу ——— */

  function addItem(title, parentId) {
    return sb.from("wedding_items").insert({
      id: uid(),
      title: title,
      parent_id: parentId || "",
      position: Date.now()
    }).then(function (res) {
      if (res.error) throw res.error;
      setStatus("Пункт добавлен.", "live");
      return reload();
    });
  }

  function deleteItem(item) {
    var ids = [item.id];
    (function collect(id) {
      childrenOf(id).forEach(function (kid) { ids.push(kid.id); collect(kid.id); });
    })(item.id);

    return sb.from("wedding_options").delete().in("item_id", ids)
      .then(function (res) {
        if (res.error) throw res.error;
        return sb.from("wedding_items").delete().in("id", ids);
      })

  var STARTER_ITEMS = [
    ["w1",  "Банкетный зал и еда на всех", "",    1],
    ["w2",  "Алкоголь",                    "",    2],
    ["w3",  "Торт",                        "",    3],

    ["w7",  "Причёска и макияж в салоне",  "",    8],

  /* Фото уменьшаем: длинная сторона до 1000 px, JPEG. Память браузера —
     около 5 МБ на всю страницу, пара снимков с телефона съели бы её целиком. */
  function shrinkImage(file) {
    return new Promise(function (resolve, reject) {
      if (!file) { reject(new Error("файл не выбран")); return; }
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error("не удалось прочитать файл")); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error("это не похоже на картинку")); };
        img.onload = function () {
          var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
          var k = Math.min(1, 1000 / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h * k));
          try {
            var canvas = document.createElement("canvas");
            canvas.width = cw;
            canvas.height = ch;
            canvas.getContext("2d").drawImage(img, 0, 0, cw, ch);
            resolve(canvas.toDataURL("image/jpeg", 0.72));
          } catch (e) {
            resolve(String(reader.result));
          }
        };
        img.src = String(reader.result);
      };
      reader.readAsDataURL(file);
    });
  }

  function createLocalClient() {
    var KEY = "svadba:local:v1";

    function fresh() {
      var now = new Date().toISOString();
      return {
        meta: { id: "wedding", title: "Наша свадьба", wedding_date: DEFAULT_DATE },
        items: STARTER_ITEMS.map(function (r) {
          return { id: r[0], title: r[1], parent_id: r[2], position: r[3], created_at: now };
        }),
        options: []
      };
    }

    function read() {
      var raw = store(KEY);
      if (raw) {
        try {
          var saved = JSON.parse(raw);
          if (saved && saved.meta && saved.items && saved.options) return saved;
        } catch (e) { /* испорченная запись — начинаем со стартового списка */ }
      }
      return fresh();
    }

    var db = read();

    function write() {
      try {
        localStorage.setItem(KEY, JSON.stringify(db));
      } catch (e) {
        throw new Error("не хватило места в памяти браузера — обычно из-за фотографий");
      }
    }

    function rowsOf(table) {
      if (table === "wedding_meta") return [db.meta];
      if (table === "wedding_items") return db.items;
      if (table === "wedding_options") return db.options;
      throw new Error("неизвестная таблица " + table);
    }

    function copy(row) {
      var out = {};
      for (var k in row) if (Object.prototype.hasOwnProperty.call(row, k)) out[k] = row[k];
      return out;
    }

    function fill(table, row) {
      var out = copy(row);
      if (!out.id) out.id = uid();
      if (!out.created_at) out.created_at = new Date().toISOString();
      if (table === "wedding_items") {
        if (out.parent_id == null) out.parent_id = "";
        if (out.position == null) out.position = Date.now();
      }
      if (table === "wedding_options") {
        if (out.item_id == null) out.item_id = "";
        if (out.title == null) out.title = "";
        if (out.url == null) out.url = "";
        if (out.price == null) out.price = 0;
        if (out.paid == null) out.paid = false;
        if (out.image_path == null) out.image_path = "";
      }
      return out;
    }

    function matches(row, filters) {
      for (var i = 0; i < filters.length; i++) {
        var f = filters[i];
        if (f.kind === "eq" && row[f.col] !== f.value) return false;
        if (f.kind === "in" && f.value.indexOf(row[f.col]) < 0) return false;
      }
      return true;
    }

    function run(table, q) {
      var list = rowsOf(table);
      var hit = [];
      for (var i = 0; i < list.length; i++) if (matches(list[i], q.filters)) hit.push(list[i]);

      if (q.op === "select") {
        var data = hit.slice();
        if (q.orderBy) {
          var col = q.orderBy.col, up = q.orderBy.ascending ? 1 : -1;
          data.sort(function (a, b) {
            if (a[col] === b[col]) return 0;
            return (a[col] > b[col] ? 1 : -1) * up;
          });
        }
        return q.single ? (data[0] || null) : data;
      }

      if (q.op === "insert") {
        var row = fill(table, q.row);
        list.push(row);
        write();
        return [row];
      }

      if (q.op === "upsert") {
        if (table === "wedding_meta") {
          var incoming = q.row;
          for (var m in incoming) {
            if (Object.prototype.hasOwnProperty.call(incoming, m)) db.meta[m] = incoming[m];
          }
          write();
          return [db.meta];
        }
        var found = null;
        for (var j = 0; j < list.length; j++) if (list[j].id === q.row.id) found = list[j];
        if (found) {
          for (var u in q.row) {
            if (Object.prototype.hasOwnProperty.call(q.row, u)) found[u] = q.row[u];
          }
        } else {
          found = fill(table, q.row);
          list.push(found);
        }
        write();
        return [found];
      }

      if (q.op === "update") {
        for (var h = 0; h < hit.length; h++) {
          for (var p in q.patch) {
            if (Object.prototype.hasOwnProperty.call(q.patch, p)) hit[h][p] = q.patch[p];
          }
        }
        write();
        return hit;
      }

      if (q.op === "delete") {
        for (var d = list.length - 1; d >= 0; d--) {
          if (hit.indexOf(list[d]) >= 0) list.splice(d, 1);
        }
        write();
        return hit;
      }

      throw new Error("неизвестная операция");
    }

    function query(table) {
      var q = { op: "select", filters: [], row: null, patch: null, orderBy: null, single: false };
      var api = {
        select:      function ()           { q.op = "select"; return api; },
        insert:      function (row)        { q.op = "insert"; q.row = row; return api; },
        update:      function (patch)      { q.op = "update"; q.patch = patch; return api; },
        upsert:      function (row)        { q.op = "upsert"; q.row = row; return api; },
        delete:      function ()           { q.op = "delete"; return api; },
        eq:          function (col, value) { q.filters.push({ kind: "eq", col: col, value: value }); return api; },
        in:          function (col, values){ q.filters.push({ kind: "in", col: col, value: values || [] }); return api; },
        order:       function (col, opts)  { q.orderBy = { col: col, ascending: !opts || opts.ascending !== false }; return api; },
        maybeSingle: function ()           { q.single = true; return api; },
        then: function (onDone, onFail) {
          var result;
          try {
            result = { data: run(table, q), error: null };
          } catch (e) {
            result = { data: null, error: { message: e && e.message ? e.message : String(e) } };
          }
          return Promise.resolve(result).then(onDone, onFail);
        }
      };
      return api;
    }

    return {
      from: query,
      storage: {
        from: function () {
          return {
            upload: function (path, file) {
              return shrinkImage(file).then(function (dataUrl) {
                return { data: { path: dataUrl }, error: null };
              }, function (err) {
                return { data: null, error: { message: err && err.message ? err.message : "не удалось прочитать файл" } };
              });
            }
          };
        }
      },
      channel: function () {
        var live = { on: function () { return live; }, subscribe: function () { return live; } };
        return live;
      }
    };
  }

  /* ——— запуск ——— */

  function start() {
    renderDate();
    render();
    setInterval(renderDate, 3600000);

    var configured = CONFIG.SUPABASE_URL.indexOf("http") === 0 && CONFIG.SUPABASE_ANON_KEY.length >= 20;

    /* Ключи не вписаны — работаем на памяти браузера. */
    if (!configured) {
      localMode = true;
      sb = createLocalClient();
      ready = true;
      loadAll();
      return;
    }

    if (!window.supabase || !window.supabase.createClient) {
      setStatus("Не загрузилась библиотека базы. Проверьте интернет и обновите страницу.", "off");
      return;
    }

    sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    ready = true;
    loadAll().then(subscribeLive);
  }

  initGate();
})();
</script>
</body>
</html>
